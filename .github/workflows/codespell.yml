name: codespell

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install codespell
        run: python -m pip install codespell

      - name: Run codespell
        run: codespell
