site_name: 'Luna'

site_url: http://zzz-luna.org/luna

site_description: Documentation for the Luna software

site_author: S. M. Purcell

theme:
    name: 'material'

    features:
        - navigation.tabs
        - navigation.top
    
    palette:
      primary: 'indigo'
      accent: 'indigo'
      
#    custom_dir: '/usr/local/lib/python3.7/site-packages/mkdocs_material-3.2.0.dist-info/'

    highlightjs: false

    shortcuts:
        help: 191    # ?
        next: 78     # n
        previous: 80 # p
        search: 83   # s

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html

extra_javascript:
  - 'javascripts/mathjax.js'
  - 'https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js'
  - 'javascripts/extra.js'

extra_css:
  - 'stylesheets/extra.css'
      
